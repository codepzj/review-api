syntax = "proto3";

package api.business.v1;

option go_package = "review-c/api/business/v1;v1";
option java_multiple_files = true;
option java_package = "api.business.v1";
import "google/api/annotations.proto";
	
service Business {
	rpc CreateReply (CreateReplyRequest) returns (CreateReplyResponse){
		option (google.api.http) = {
			post: "/business/v1/reply",
			body: "*"
		};
	};
}

message CreateReplyRequest {
	int64 review_id = 1;
	int64 store_id = 2;
	string content = 3;
	string pic_info = 4;
	string video_info = 5;
}
message CreateReplyResponse {
	int64 reply_id = 1;
}
